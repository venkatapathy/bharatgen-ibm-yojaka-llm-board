services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-qgen_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://10.129.7.47:11434}
      UNLIMITED_OCR_URL: ${UNLIMITED_OCR_URL:-http://10.129.7.47:11441}
      UNLIMITED_OCR_MODEL: ${UNLIMITED_OCR_MODEL:-frob/unlimited-ocr:q8_0}
      PDF_FORCE_UNLIMITED_OCR: ${PDF_FORCE_UNLIMITED_OCR:-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      DJANGO_SETTINGS_MODULE: qgen.settings.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A qgen worker -l info --concurrency=3
    volumes:
      - .:/app
      - media_data:/app/media
      - /home/pankaj/.cache/huggingface:/root/.cache/huggingface:ro
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://10.129.7.47:11434}
      UNLIMITED_OCR_URL: ${UNLIMITED_OCR_URL:-http://10.129.7.47:11441}
      UNLIMITED_OCR_MODEL: ${UNLIMITED_OCR_MODEL:-frob/unlimited-ocr:q8_0}
      PDF_FORCE_UNLIMITED_OCR: ${PDF_FORCE_UNLIMITED_OCR:-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      DJANGO_SETTINGS_MODULE: qgen.settings.development
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A qgen beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://10.129.7.47:11434}
      UNLIMITED_OCR_URL: ${UNLIMITED_OCR_URL:-http://10.129.7.47:11441}
      UNLIMITED_OCR_MODEL: ${UNLIMITED_OCR_MODEL:-frob/unlimited-ocr:q8_0}
      PDF_FORCE_UNLIMITED_OCR: ${PDF_FORCE_UNLIMITED_OCR:-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      DJANGO_SETTINGS_MODULE: qgen.settings.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  ollama_data:
