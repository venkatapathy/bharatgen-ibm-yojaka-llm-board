# Fully independent dev2.3 stack (project: qgen23). Does NOT use 2.1 db/redis/media/network.
# Port 8002. Own Postgres :5435, Redis :6383, media volume qgen23_media_data.
#
# Media: Docker volume at /var/qgen_media (NFS code mount cannot host /app/media overlay).
# Dual-write mirror: ./backups/media → /var/qgen_media_mirror
#
#   docker compose -f docker-compose.dev23.yml -p qgen23 up -d --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-qgen_db_dev23}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6383:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: qgen23-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/var/qgen_media
      - ./backups/media:/var/qgen_media_mirror
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-qgen_db_dev23}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /var/qgen_media
      MEDIA_MIRROR_ROOT: /var/qgen_media_mirror
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://10.129.7.47:11434}
      UNLIMITED_OCR_URL: ${UNLIMITED_OCR_URL:-http://10.129.7.47:11441}
      UNLIMITED_OCR_MODEL: ${UNLIMITED_OCR_MODEL:-frob/unlimited-ocr:q8_0}
      PDF_FORCE_UNLIMITED_OCR: ${PDF_FORCE_UNLIMITED_OCR:-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      DJANGO_SETTINGS_MODULE: qgen.settings.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: qgen23-worker
    command: celery -A qgen worker -l info --concurrency=2 -n worker23@%h
    volumes:
      - .:/app
      - media_data:/var/qgen_media
      - ./backups/media:/var/qgen_media_mirror
      - /home/pankaj/.cache/huggingface:/root/.cache/huggingface:ro
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-qgen_db_dev23}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /var/qgen_media
      MEDIA_MIRROR_ROOT: /var/qgen_media_mirror
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://10.129.7.47:11434}
      UNLIMITED_OCR_URL: ${UNLIMITED_OCR_URL:-http://10.129.7.47:11441}
      UNLIMITED_OCR_MODEL: ${UNLIMITED_OCR_MODEL:-frob/unlimited-ocr:q8_0}
      PDF_FORCE_UNLIMITED_OCR: ${PDF_FORCE_UNLIMITED_OCR:-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      DJANGO_SETTINGS_MODULE: qgen.settings.development
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    image: qgen23-worker
    command: celery -A qgen beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-qgen_db_dev23}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /var/qgen_media
      MEDIA_MIRROR_ROOT: /var/qgen_media_mirror
      DJANGO_SETTINGS_MODULE: qgen.settings.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
