# Slim stack for dev2.3 WIP — shares Postgres/Redis/media with qgen_project (dev2.1).
# Port 8002. Own images: qgen23-web / qgen23-worker (do not rebuild 2.1).
#
# Build + start (2.3 only):
#   docker compose -f docker-compose.dev23.yml -p qgen23 build
#   docker compose -f docker-compose.dev23.yml -p qgen23 up -d
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: qgen23-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://10.129.7.47:11434}
      UNLIMITED_OCR_URL: ${UNLIMITED_OCR_URL:-http://10.129.7.47:11441}
      UNLIMITED_OCR_MODEL: ${UNLIMITED_OCR_MODEL:-frob/unlimited-ocr:q8_0}
      PDF_FORCE_UNLIMITED_OCR: ${PDF_FORCE_UNLIMITED_OCR:-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      DJANGO_SETTINGS_MODULE: qgen.settings.development
    networks:
      - default
      - shared
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: qgen23-worker
    command: celery -A qgen worker -l info --concurrency=2 -n worker23@%h
    volumes:
      - .:/app
      - media_data:/app/media
      - /home/pankaj/.cache/huggingface:/root/.cache/huggingface:ro
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://10.129.7.47:11434}
      UNLIMITED_OCR_URL: ${UNLIMITED_OCR_URL:-http://10.129.7.47:11441}
      UNLIMITED_OCR_MODEL: ${UNLIMITED_OCR_MODEL:-frob/unlimited-ocr:q8_0}
      PDF_FORCE_UNLIMITED_OCR: ${PDF_FORCE_UNLIMITED_OCR:-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      DJANGO_SETTINGS_MODULE: qgen.settings.development
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /root/.cache/huggingface
    networks:
      - default
      - shared
    restart: unless-stopped

  celery_beat:
    image: qgen23-worker
    command: celery -A qgen beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
      DJANGO_SETTINGS_MODULE: qgen.settings.development
    networks:
      - default
      - shared
    restart: unless-stopped
    depends_on:
      - celery_worker

networks:
  shared:
    external: true
    name: qgen_project_default

volumes:
  media_data:
    external: true
    name: qgen_project_media_data
