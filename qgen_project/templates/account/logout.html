{% extends "base.html" %}
{% block title %}Logout{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="eyebrow">End session</div>
    <h1>Sign out</h1>
    <p>Are you sure you want to sign out of the EduQGen demo?</p>
    <form method="post">
      {% csrf_token %}
      <div class="btn-row">
        <button class="btn btn-primary" type="submit">Sign out</button>
        <a class="btn" href="{% url 'core:dashboard' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
