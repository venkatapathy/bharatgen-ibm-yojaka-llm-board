{% extends "base.html" %}
{% block title %}Upload PDF Context{% endblock %}
{% block content %}
<h1>Upload PDF / ZIP</h1>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Upload &amp; Index</button>
  <a href="{% url 'pdf_module:list' %}" class="btn">Cancel</a>
</form>
{% endblock %}
